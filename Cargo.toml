[package]
name = "zjpm"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A package manager for Zellij plugins"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
kdl = { version = "6.7", default-features = false, features = ["span"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
ureq = { version = "~3.4.2", default-features = false, features = ["json", "rustls"] }
wasmparser = { version = "0.259", default-features = false, features = ["std", "validate", "simd"] }
